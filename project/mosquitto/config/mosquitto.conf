allow_anonymous false

listener 1883
protocol mqtt

listener 9001
protocol websockets

auth_plugin /mosquitto/go-auth.so

auth_opt_backends jwt
auth_opt_jwt_mode remote

auth_opt_jwt_host spring-boot-app
auth_opt_jwt_port 8080
auth_opt_jwt_getuser_uri /api/mqtt/auth
auth_opt_jwt_aclcheck_uri /api/mqtt/acl

auth_opt_jwt_http_method POST
auth_opt_jwt_http_timeout 5
auth_opt_jwt_response_mode status
auth_opt_jwt_params_mode json

persistence true
persistence_file mosquitto.db
persistence_location /mosquitto/data/